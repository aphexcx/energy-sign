plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services' // Google Services Gradle plugin
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlin_version"
    id 'org.jetbrains.kotlinx.atomicfu' version '0.26.1'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "cx.aphex.energysign"
        minSdkVersion 27
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        // The keys and settings of this build. No file, or a file without them, is a build
        // without them: the code treats an empty value as "not set".
        Properties properties = new Properties()
        def localPropertiesFile = project.rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        // A local.properties value as a Java string literal. The value may be written with or
        // without double quotes around it; a missing property becomes "". Every character that
        // cannot stand in a literal as it is gets escaped (a backslash, a quote, a line end or any
        // other control character), so no value, whatever it holds, can break BuildConfig.java.
        // A value that is far too long to be a key or a setting is left out (a string constant has
        // a size limit, and beyond it BuildConfig.java does not compile). The warning names the
        // setting, never its value.
        def localProperty = { String name ->
            String value = (properties.getProperty(name) ?: '').trim()
            if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length() - 1)
            }
            if (value.length() > 4096) {
                logger.warn("local.properties: ${name} is too long to be what it should be; this build has no ${name}")
                value = ''
            }
            StringBuilder literal = new StringBuilder('"')
            for (char c : value.toCharArray()) {
                if (c == (char) '\\') literal.append('\\\\')
                else if (c == (char) '"') literal.append('\\"')
                else if (c == (char) '\n') literal.append('\\n')
                else if (c == (char) '\r') literal.append('\\r')
                else if (c == (char) '\t') literal.append('\\t')
                // octal, not a unicode escape: javac turns the unicode escape of a line end into a real one, inside a literal too
                else if (c < (char) ' ' || c == (char) 0x7f) literal.append(String.format('\\%03o', (int) c))
                else literal.append(c)
            }
            return literal.append('"').toString()
        }
        buildConfigField("String", "OPENAI_API_KEY", localProperty('OPENAI_API_KEY'))
        buildConfigField("String", "DEEPGRAM_API_KEY", localProperty('DEEPGRAM_API_KEY'))
        buildConfigField("String", "ANTHROPIC_API_KEY", localProperty('ANTHROPIC_API_KEY'))
        // A setting that picks one of a few names. Only a short plain word is put into the build;
        // anything else becomes "invalid", which names nothing: the app then warns and uses its
        // default. The warning here names the setting, never its value.
        def localSelector = { String name ->
            String value = (properties.getProperty(name) ?: '').trim()
            if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length() - 1).trim()
            }
            if (value ==~ /[A-Za-z0-9_-]{0,32}/) return '"' + value + '"'
            logger.warn("local.properties: ${name} is not one of the names it can have; the default is used")
            return '"invalid"'
        }
        // Which provider writes the replies: anthropic (the default when absent) or openai.
        buildConfigField("String", "AI_PROVIDER", localSelector('AI_PROVIDER'))
        // How hard the model thinks: low, medium, high (the default when absent), xhigh or max.
        buildConfigField("String", "AI_EFFORT", localSelector('AI_EFFORT'))
        // The UTC date of this build. A device clock that reads earlier is wrong (the device has no
        // battery-backed clock), and then no date or time goes into a prompt.
        buildConfigField("String", "BUILD_DATE", '"' + java.time.LocalDate.now(java.time.ZoneOffset.UTC) + '"')
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    namespace 'cx.aphex.energysign'

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            // a test that hangs fails, it does not hold the build
            systemProperty 'junit.jupiter.execution.timeout.default', '60 s'
        }
        // android.util.Log and friends return 0/null in JVM tests instead of throwing
        // (MessageManagerOwnerTest runs the real MessageManager, which logs)
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly 'com.google.android.things:androidthings:1.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'com.ibm.icu:icu4j:67.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    ext.koin_version = "3.5.6"
    implementation "io.insert-koin:koin-android:$koin_version"
    // Koin for Ktor
//    implementation "io.insert-koin:koin-ktor:$koin_version"
//    // SLF4J Logger
//    implementation "io.insert-koin:koin-logger-slf4j:$koin_version"

    // Add the Firebase Crashlytics SDK.
    implementation platform('com.google.firebase:firebase-bom:33.13.0')

    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Memoization: replaced deprecated Funktionale library with Arrow's memoize extension
    ext.arrow_version = '2.1.1'
    implementation "io.arrow-kt:arrow-core:$arrow_version"
    implementation "io.arrow-kt:arrow-fx-coroutines:$arrow_version"

    ext.ver_kotpref = "2.11.0"
    implementation "com.chibatching.kotpref:kotpref:$ver_kotpref"
//    implementation "com.chibatching.kotpref:gson-support:$ver_kotpref"

    implementation "org.jetbrains.kotlinx:atomicfu:0.26.1"

    ext.ktor_version = "2.3.12"
    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-gson:$ktor_version"
    implementation 'io.ktor:ktor-client-okhttp'
//    implementation "io.ktor:ktor-gson:$ktor_version"

    ext.ver_rxjava = '3.1.10'
    ext.ver_rxandroid = "3.0.2"
    implementation "io.reactivex.rxjava3:rxjava:$ver_rxjava"
    implementation "io.reactivex.rxjava3:rxandroid:$ver_rxandroid"
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.0'

//    implementation "org.jetbrains.kotlinx:atomicfu-common:0.14.3"

    implementation 'com.vdurmont:emoji-java:5.1.1'

    implementation platform('com.aallam.openai:openai-client-bom:3.8.2')
    implementation 'com.aallam.openai:openai-client'

    // The official Anthropic SDK (Kotlin uses the Java SDK).
    implementation 'com.anthropic:anthropic-java:3.3.0'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'

    // Kotlin Test
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.20'

    // Mockito 5 mocks final classes itself (no mockito-inline artifact) and reads the class files of Java 17 and 21
    testImplementation 'org.mockito:mockito-core:5.24.0'
    // The tests build Android objects without their constructors; Mockito 5 has Objenesis at run time only
    testImplementation 'org.objenesis:objenesis:3.3'

    // A local stand-in for the Messages API: the SDK client is tested over real HTTP, never against the live service.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
